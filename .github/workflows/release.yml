name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: modellang
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d modellang"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing-capable npm
        run: npm install --global npm@latest
      - name: Verify tag and package version
        run: node -e "const expected='v'+require('./package.json').version;if(process.env.GITHUB_REF_NAME!==expected)throw new Error('tag '+process.env.GITHUB_REF_NAME+' does not match '+expected)"
      - run: npm ci
      - run: npm run model:check
      - run: npm run model:generate
      - run: git diff --exit-code
      - run: npm run health
      - name: Publish with bootstrap token
        if: env.HAS_NPM_BOOTSTRAP_TOKEN == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish with trusted publisher
        if: env.HAS_NPM_BOOTSTRAP_TOKEN != 'true'
        run: npm publish --access public
